version: "3.8"

services:

  web:
    build: .
    container_name: flask_app
    ports:
      - "10000:10000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/demo_db
      EMAIL: example@mail.com
      EMAIL_PASSWORD: example
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: demo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
